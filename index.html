<meta charset="utf-8">
<title>せいざパズル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 画面の考え方：960×532 の「舞台」を作り、端末の大きさに合わせて丸ごと拡大・縮小する。
   宇宙のゲームなので、暗い色の1つの見た目に決めている（明るいテーマは作らない） */
:root{
  color-scheme: dark;
  --sky:#0f1438;        /* 舞台のまわりの夜空 */
  --navy:#1a1f4a;       /* ピースのふち・文字の濃い色 */
  --panel:rgba(16,20,58,.62); /* 盤のうしろの板 */
  --line:#6fb7ff;       /* 水色のふち */
  --star:#ffd23f;       /* 星の黄色 */
  --ink:#ffffff;        /* 白い文字 */
  --soft:#c9d6ff;       /* うすい文字 */
  --f-dot:"DotGothic16","Zen Maru Gothic",system-ui,sans-serif;   /* 見出しだけドット文字 */
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif; /* 本文 */
  --C:52px;             /* 盤のマス1つの大きさ（ステージごとに変わる） */
  --ts:.7;              /* 手持ちのピースの大きさ（盤に対する割合） */
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:960px;height:532px;transform-origin:center center;overflow:hidden;touch-action:none;
  background:var(--sky) url(img/bg_hajimari.png) center/100% 100% no-repeat;image-rendering:pixelated}
img{image-rendering:pixelated;max-width:none;pointer-events:none}
.screen{position:absolute;inset:0}
button{font-family:var(--f-body);font-weight:900;color:var(--ink);cursor:pointer;border:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--star);outline-offset:3px}

/* 丸いボタン（タッチ用に大きく） */
.pill{background:rgba(20,26,70,.9);border:4px solid var(--line);border-radius:999px;font-size:26px;padding:10px 34px}
.pill:active{transform:translateY(2px)}
.pill.gold{background:var(--star);color:var(--navy);border-color:#fff3a0}
.tag{position:absolute;left:50%;transform:translateX(-50%);top:10px;background:rgba(20,26,70,.9);border:3px solid var(--line);
  border-radius:999px;padding:6px 26px;font-family:var(--f-dot);font-size:22px;white-space:nowrap}
.testbadge{position:absolute;right:12px;bottom:8px;background:#f06c9b;color:#fff;font-size:14px;font-weight:900;padding:3px 10px;border-radius:8px;z-index:50}

/* タイトル */
#title .logo{position:absolute;left:0;right:0;top:92px;text-align:center;font-family:var(--f-dot);font-size:72px;letter-spacing:.08em;
  color:var(--star);text-shadow:0 4px 0 var(--navy),0 0 24px rgba(255,210,63,.45)}
#title .sub{position:absolute;left:0;right:0;top:186px;text-align:center;font-size:22px;color:var(--soft);font-weight:700}
#title .go{position:absolute;left:50%;top:300px;transform:translateX(-50%);font-size:34px;padding:14px 60px}
#title .hero{position:absolute;left:39px;top:170px;width:162px}
#title .usagi{position:absolute;left:766px;top:148px;width:148px;filter:saturate(.35) brightness(.6)}

/* はじめての登録：番号は数字ボタン、名前はランダム（自分で打つこともできる） */
#reg .card{position:absolute;left:120px;top:34px;width:720px;background:var(--panel);border:3px solid var(--line);border-radius:18px;
  padding:14px 26px;display:grid;grid-template-columns:300px 1fr;gap:8px 28px;box-sizing:border-box}
#reg h2{grid-column:1/-1;margin:0;font-family:var(--f-dot);font-size:28px;font-weight:400;text-align:center}
#reg .col{display:flex;flex-direction:column;gap:8px;min-width:0}
#reg .lab{font-size:20px;font-weight:700}
#reg .idbox{height:50px;border-radius:12px;background:#fff;color:var(--navy);font-size:36px;font-weight:900;display:grid;place-items:center;letter-spacing:4px}
#reg .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#reg .keys button{height:46px;border-radius:12px;background:rgba(20,26,70,.95);border:3px solid var(--line);font-size:26px}
#reg .keys button:active{background:var(--line);color:var(--navy)}
#reg .keys .del{font-size:18px}
#reg .namebox{min-height:84px;border-radius:14px;background:#fff;color:var(--navy);font-size:34px;font-weight:900;display:grid;place-items:center;text-align:center;padding:6px 10px;line-height:1.2}
#reg .row{display:flex;gap:10px;flex-wrap:wrap}
#reg .row .pill{font-size:20px;padding:8px 20px;border-width:3px}
#reg input{font-family:var(--f-body);font-size:28px;padding:10px 14px;border-radius:12px;border:3px solid var(--line);background:#fff;color:var(--navy);min-width:0}
#reg .note{font-size:16px;color:var(--soft);margin:0}
#reg .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px}
#reg .err{font-size:18px;color:#ffb3c6;margin:0;min-height:1.2em}

/* 銀河の地図 */
#map .who{position:absolute;left:14px;top:12px;font-size:18px;font-weight:700;background:rgba(20,26,70,.85);border-radius:999px;padding:6px 16px;border:2px solid var(--line)}
#map .arrow{position:absolute;top:8px;width:52px;height:44px;border-radius:999px;background:rgba(20,26,70,.9);border:3px solid var(--line);font-size:22px}
#map .arrow.l{left:calc(50% - 230px)} #map .arrow.r{left:calc(50% + 178px)}
#map .node{position:absolute;width:92px;height:110px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none}
#map .ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(20,26,70,.82);border:4px solid #3a4796;overflow:hidden}
#map .ring img{max-height:66px;max-width:70px}
#map .node.open .ring{border-color:var(--star);box-shadow:0 0 0 4px rgba(255,210,63,.28),0 0 22px rgba(255,210,63,.6);animation:pulse 1.6s ease-in-out infinite}
#map .node.done .ring{border-color:var(--line)}
#map .node.lock img{filter:brightness(.28) saturate(0)}
#map .node .lbl{font-family:var(--f-dot);font-size:17px;text-shadow:0 2px 0 var(--navy)}
#map .node .stars{font-size:14px;color:var(--star);letter-spacing:1px;height:16px;text-shadow:0 1px 0 var(--navy)}
#map .node.boss .ring{width:96px;height:96px}
#map .msg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(20,26,70,.9);border:3px solid var(--line);border-radius:14px;
  padding:8px 22px;font-size:20px;font-weight:700;white-space:nowrap}
#map svg.path{position:absolute;inset:0;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,210,63,.12),0 0 30px rgba(255,210,63,.8)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* パートナー（主人公の足もと） */
.partner{position:absolute;z-index:4}
#map .side{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:6}
#map .side .pill{font-size:18px;padding:5px 18px;border-width:3px}
#map .side .jump{animation:pulse 1.6s ease-in-out infinite}
/* ダイアログ（子ども向け） */
.dlg{position:absolute;inset:0;background:rgba(10,12,40,.7);display:grid;place-items:center;z-index:60}
.dlg .box{width:700px;max-height:500px;overflow:auto;background:rgba(20,26,70,.98);border:4px solid var(--line);border-radius:18px;padding:16px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font-family:var(--f-dot);font-weight:400;font-size:26px;color:var(--star);text-align:center}
.dlg p{margin:0;font-size:18px;font-weight:700;line-height:1.5}
.dlg .two{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.dlg .qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
.dlg .qr svg{width:220px;height:220px}
.dlg textarea{width:100%;box-sizing:border-box;height:110px;font-size:14px;border-radius:10px;border:3px solid var(--line);padding:8px;font-family:ui-monospace,monospace;color:var(--navy);background:#fff;-webkit-user-select:text;user-select:text}
.dlg .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.dlg .row .pill{font-size:20px;padding:8px 22px}
.dlg video{width:100%;max-height:300px;background:#000;border-radius:10px}
.dlg .note{font-size:15px;color:var(--soft)}

/* 先生画面（舞台の外に、ふつうのページとして出す） */
#teacher{position:fixed;inset:0;z-index:200;background:#10153a;color:#fff;overflow:auto;font-family:var(--f-body);-webkit-user-select:text;user-select:text;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;box-sizing:border-box}
#teacher .in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#teacher header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#teacher h1{margin:0;font-family:var(--f-dot);font-weight:400;font-size:26px;color:var(--star)}
#teacher nav{display:flex;gap:8px;flex-wrap:wrap}
#teacher nav button,#teacher .btn{font-size:16px;padding:8px 16px;border-radius:999px;background:#1d2560;border:2px solid var(--line);color:#fff;font-weight:700}
#teacher nav button.on{background:var(--star);color:var(--navy);border-color:#fff3a0}
#teacher .btn.gold{background:var(--star);color:var(--navy);border-color:#fff3a0}
#teacher section{background:#161d4c;border:1px solid #2f3a85;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
#teacher h2{margin:0;font-size:19px}
#teacher p,#teacher li{margin:0;font-size:15px;line-height:1.6;color:#dfe6ff}
#teacher textarea{width:100%;box-sizing:border-box;height:120px;font-family:ui-monospace,monospace;font-size:13px;border-radius:10px;padding:8px;border:2px solid var(--line);background:#fff;color:#111}
#teacher .tw{overflow-x:auto}
#teacher table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
#teacher th,#teacher td{border-bottom:1px solid #2f3a85;padding:7px 8px;text-align:left;white-space:nowrap}
#teacher th{color:var(--soft);font-weight:700;position:sticky;top:0;background:#161d4c}
#teacher tr.click{cursor:pointer} #teacher tr.click:hover td{background:#1f2864}
#teacher .chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#2b3478}
#teacher .chip.warn{background:#7a2e4a} #teacher .chip.good{background:#1e6b46}
#teacher select,#teacher input[type=text]{font-size:15px;padding:5px 8px;border-radius:8px;border:2px solid var(--line);background:#fff;color:#111}
#teacher .flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#teacher .qrbox{background:#fff;padding:10px;border-radius:10px;line-height:0;width:max-content}
#teacher .qrbox svg{width:260px;height:260px}
#teacher .msg{font-size:15px;font-weight:700;color:var(--star);min-height:1.4em}
#teacher svg.chart text{fill:#c9d6ff;font-size:11px}
#teacher video{width:100%;max-width:480px;border-radius:10px;background:#000}


/* なかま ずかん */
#zukan .back{position:absolute;left:14px;top:12px;font-size:18px;padding:6px 18px;border-width:3px}
#zukan .rows{position:absolute;left:24px;right:24px;top:58px;display:flex;flex-direction:column;gap:3px}
#zukan .gname{position:relative;z-index:3;font-family:var(--f-dot);font-size:14px;color:#fff;margin:0 0 2px 6px;line-height:1.15;text-shadow:0 1px 0 var(--navy)}
#zukan .row9{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
#zukan .zc{position:relative;overflow:hidden;height:62px;border-radius:10px;background:rgba(20,26,70,.85);border:3px solid #3a4796;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
#zukan .zc .st{font-size:11px;letter-spacing:1px;line-height:1;height:11px;color:var(--star)}
#zukan .zc img{max-height:34px;max-width:56px}
#zukan .zc .nm{font-size:11px;font-weight:700;color:var(--soft);white-space:nowrap}
#zukan .zc.lock img{filter:brightness(.25) saturate(0)}
/* ★1 銅：二重のわく */
#zukan .zc.b1{border:5px double #c98a4b;background:rgba(60,36,20,.75)}
/* ★2 銀：太いわく＋四すみの星 */
#zukan .zc.b2{border:5px solid #dfe7f3;background:
  radial-gradient(circle at 7px 7px,#fff 2px,transparent 3px),radial-gradient(circle at calc(100% - 7px) 7px,#fff 2px,transparent 3px),
  radial-gradient(circle at 7px calc(100% - 7px),#fff 2px,transparent 3px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#fff 2px,transparent 3px),
  linear-gradient(rgba(150,165,195,.45),rgba(60,70,110,.85))}
/* ★3 金：金のグラデーションのわく＋かんむり＋光が走る */
#zukan .zc.b3{border:5px solid transparent;background:
  linear-gradient(rgba(120,86,10,.85),rgba(60,40,5,.92)) padding-box,
  linear-gradient(135deg,#fff3a0,#ffb300 35%,#fff3a0 55%,#c98a00) border-box;box-shadow:0 0 14px rgba(255,210,63,.75)}
#zukan .zc.b3::before{content:"";position:absolute;top:3px;left:50%;width:22px;height:12px;margin-left:-11px;background:#ffd23f;
  clip-path:polygon(0 100%,0 20%,25% 60%,50% 0,75% 60%,100% 20%,100% 100%);z-index:2}
#zukan .zc.b3::after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-15deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
#zukan .zc.pt{outline:3px dashed #fff;outline-offset:2px}
#zukan .suits{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;align-items:center;gap:8px}
#zukan .suits .lab{font-size:15px;font-weight:700;white-space:nowrap;text-shadow:0 1px 0 var(--navy)}
#zukan .suit{width:98px;height:38px;white-space:nowrap;border-radius:999px;border:3px solid var(--line);background:rgba(20,26,70,.9);font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
#zukan .suit i{width:16px;height:16px;border-radius:50%;display:inline-block}
#zukan .suit.on{background:var(--star);color:var(--navy);border-color:#fff3a0}
#zukan .suit:disabled{opacity:.4}
#card{position:absolute;inset:0;background:rgba(10,12,40,.65);display:grid;place-items:center;z-index:45}
#card .box{width:640px;background:rgba(20,26,70,.98);border:5px solid #3a4796;border-radius:20px;padding:18px 24px;display:grid;grid-template-columns:230px 1fr;gap:6px 22px;box-sizing:border-box}
#card .box{position:relative}
#card .box.b1{border:7px double #c98a4b}
#card .box.b2{border:6px solid #dfe7f3;background:linear-gradient(rgba(150,165,195,.35),rgba(20,26,70,.98) 45%)}
#card .box.b3{border:6px solid transparent;background:linear-gradient(rgba(110,80,10,.96),rgba(20,26,70,.98) 55%) padding-box,linear-gradient(135deg,#fff3a0,#ffb300 35%,#fff3a0 55%,#c98a00) border-box;box-shadow:0 0 30px rgba(255,210,63,.6)}
#card .tw{position:absolute;width:6px;height:6px;background:#fff3a0;box-shadow:6px 0 0 #fff3a0,-6px 0 0 #fff3a0,0 6px 0 #fff3a0,0 -6px 0 #fff3a0;animation:tw 1.2s steps(2) infinite}
#card .skill{grid-column:2;font-size:17px;font-weight:700;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;margin:0}
#card .skill b{color:var(--star)}
#card .pic{grid-row:1/4;display:grid;place-items:center;background:rgba(255,255,255,.06);border-radius:14px;min-height:250px}
#card h3{margin:0;font-family:var(--f-dot);font-weight:400;font-size:32px;color:var(--star)}
#card .prof{font-size:20px;font-weight:700;margin:0;line-height:1.5}
#card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:17px}
#card dt{color:var(--soft)} #card dd{margin:0;font-weight:700}
#card .my{grid-column:1/-1;display:flex;align-items:center;gap:14px;font-size:17px;color:var(--soft);font-weight:700}
#card .btns{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px}
#card .btns .pill{font-size:20px;padding:8px 22px}
.sz{position:relative}
.sz i{position:absolute;background:rgba(255,226,120,.9);box-shadow:0 0 6px rgba(255,210,63,.8);border:1px solid rgba(26,31,74,.6);box-sizing:border-box}

/* パートナーの とくぎ（演出だけ。むずかしさと記録は変わらない） */
.fx{position:absolute;pointer-events:none;z-index:28;animation:fxgo var(--dur,1s) ease-out forwards}
@keyframes fxgo{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx,0),var(--dy,0)) scale(var(--sc,.4));opacity:0}}
.fx.star{width:6px;height:6px;background:var(--c,#ffd23f);box-shadow:6px 0 0 var(--c,#ffd23f),-6px 0 0 var(--c,#ffd23f),0 6px 0 var(--c,#ffd23f),0 -6px 0 var(--c,#ffd23f)}
.fx.dot{width:10px;height:10px;background:var(--c,#ffd23f)}
.fx.bub{width:16px;height:16px;border-radius:50%;border:3px solid rgba(200,240,255,.9);background:rgba(200,240,255,.15)}
.fx.txt{font-size:26px;color:var(--c,#f06c9b);font-weight:900;text-shadow:0 2px 0 var(--navy)}
.fx.ring{border:5px solid rgba(160,230,255,.85);border-radius:50%;animation:ringgo var(--dur,1.4s) ease-out forwards}
.fx.ring.gold{border-color:rgba(255,214,102,.9)}
.fx.ring.fire{border-color:rgba(255,120,60,.9)}
@keyframes ringgo{from{transform:scale(.1);opacity:1}to{transform:scale(1);opacity:0}}
.fx.fall{animation:fall var(--dur,2s) linear forwards}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(var(--dx,0),620px)}}
#arch{position:absolute;left:0;top:0;width:960px;height:532px;pointer-events:none;z-index:27;animation:archgo 3.6s ease forwards}
@keyframes archgo{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
.partner.hop{animation:hop .5s ease}
@keyframes hop{40%{transform:translateY(-22px)}}

/* 戦い */
#battle .hero{position:absolute;left:39px;top:170px;width:162px}
#battle .foe{position:absolute;filter:saturate(.35) brightness(.6);transition:filter 1.2s ease}
#battle .foe.healed{filter:none}
#battle .board-panel{position:absolute;left:232px;top:58px;width:496px;height:378px;background:var(--panel);border:2px solid rgba(111,183,255,.5);border-radius:20px}
#battle .quit{position:absolute;left:14px;top:12px;font-size:18px;padding:6px 18px;border-width:3px}
#battle .tools{position:absolute;left:0;right:0;top:446px;display:flex;justify-content:center;gap:18px}
#battle .tools .pill{font-size:24px;padding:8px 26px}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(20,26,70,.95);border:2px solid var(--star);border-radius:10px;
  padding:4px 16px;font-size:17px;font-weight:700;white-space:nowrap;z-index:35;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.cell{position:absolute;width:var(--C);height:var(--C);box-sizing:border-box}
.cell.empty{background:rgba(20,26,70,.88);border:2px solid var(--line)}
.cell.empty::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:rgba(255,226,120,.55)}
.cell.hint{animation:hint 1s steps(2) infinite}
.ghost-on{position:absolute;box-sizing:border-box;border:3px dashed #fff;background:var(--bd);opacity:.55;z-index:3;pointer-events:none}
@keyframes hint{50%{background:rgba(255,210,63,.55)}}
/* ピース：ドット風のふち・光・影を、内側の影で描く */
.piece{position:absolute;touch-action:none;z-index:5;transform-origin:0 0;transition:transform .15s ease}
.piece.small{transform:scale(var(--ts))}
.piece.drag{z-index:20;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.piece.home{transition:left .18s ease,top .18s ease,transform .15s ease}
.piece .blk,.mini .blk{position:absolute;box-sizing:border-box;border:3px solid var(--navy);
  box-shadow:inset 5px 5px 0 var(--hi),inset -5px -5px 0 var(--sh);background:var(--bd)}
.piece .blk{width:var(--C);height:var(--C)}

/* ===== 3. 形の計算（回す・裏返す・そろえる） ======================== */
function norm(cells){
  const r0 = Math.min(...cells.map(c=>c[0])), c0 = Math.min(...cells.map(c=>c[1]));
  return cells.map(([r,c]) => [r-r0, c-c0]).sort((a,b) => a[0]-b[0] || a[1]-b[1]);
}
const keyOf = cells => JSON.stringify(norm(cells));
const rot90 = cells => norm(cells.map(([r,c]) => [c, -r]));   // 時計回りに90°
const mirror = cells => norm(cells.map(([r,c]) => [r, -c]));  // 左右を反転
const sizeOf = cells => [Math.max(...cells.map(c=>c[0]))+1, Math.max(...cells.map(c=>c[1]))+1]; // [たて, よこ]
function orientations(base, withFlip){
  const out = [], seen = new Set();
  const starts = withFlip ? [norm(base), mirror(base)] : [norm(base)];
  starts.forEach(s => { let x = s; for(let i=0;i<4;i++){ const k = keyOf(x); if(!seen.has(k)){ seen.add(k); out.push(x); } x = rot90(x); } });
  return out;
}
// 「はじめの向き」から「置いた向き」まで、最短で何回まわせばよいか（裏返しは回数に数えない）
function minRot(from, to, withFlip){
  const goal = keyOf(to);
  let best = Infinity;
  const starts = withFlip ? [norm(from), mirror(from)] : [norm(from)];
  starts.forEach(s => { let x = s; for(let i=0;i<4;i++){ if(keyOf(x)===goal) best = Math.min(best, i); x = rot90(x); } });
  return best === Infinity ? 0 : best;
}
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];

  for(let tryNo=0; tryNo<400; tryNo++){
    const occ = new Map(); const pieces = []; let ok = true;
    for(let i=0;i<n;i++){
      // 同じ形は2つまで
      let id; do{ id = pick(G.shapes); }while(pieces.filter(p=>p.shape===id).length>=2);
      const sol = pick(orientations(SHAPES[id], G.flip));
      let at;
      if(i===0){ at = [0,0]; }
      else{
        const cand = [];
        for(let r=-5;r<=8;r++) for(let c=-6;c<=9;c++){
          const cells = sol.map(([dr,dc]) => [r+dr, c+dc]);
          if(cells.some(([a,b]) => occ.has(a+','+b))) continue;
          let touch = 0;
          cells.forEach(([a,b]) => [[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y]) => { if(occ.has((a+x)+','+(b+y))) touch++; }));
          if(!touch) continue;
          const all = [...occ.values(), ...cells];
          const h = Math.max(...all.map(q=>q[0])) - Math.min(...all.map(q=>q[0])) + 1;
          const w = Math.max(...all.map(q=>q[1])) - Math.min(...all.map(q=>q[1])) + 1;
          if(w>maxW || h>maxH) continue;
          cand.push({ at:[r,c], score: w*h - touch*1.5 + Math.random()*3 });
        }
        if(!cand.length){ ok = false; break; }
        cand.sort((a,b) => a.score-b.score);
        at = cand[rnd(Math.min(3,cand.length))].at;
      }
      sol.forEach(([dr,dc]) => occ.set((at[0]+dr)+','+(at[1]+dc), [at[0]+dr, at[1]+dc]));
      pieces.push({ shape:id, sol, at });
    }
    if(!ok) continue;
    // 盤を左上にそろえる
    const all = [...occ.values()];
    const r0 = Math.min(...all.map(q=>q[0])), c0 = Math.min(...all.map(q=>q[1]));
    const board = all.map(([r,c]) => [r-r0, c-c0]);
    // うらがえさないと入らないピース（左右が非対称な形）を、決まった数だけかならず入れる
    const forceFlip = new Set();
    if(G.mustFlip){
      const chiral = pieces.map((p,i) => i).filter(i => !orientations(SHAPES[pieces[i].shape], false).some(o => keyOf(o)===keyOf(mirror(SHAPES[pieces[i].shape]))));
      if(chiral.length < G.mustFlip) continue;   // 足りなければ、作りなおす
      chiral.sort(() => Math.random()-.5).slice(0, G.mustFlip).forEach(i => forceFlip.add(i));
    }
    pieces.forEach((p,i) => {
      p.at = [p.at[0]-r0, p.at[1]-c0]; p.id = 'p'+i; p.color = COLORS[i % COLORS.length];
      // 手持ちのときの向き：はじまり＝そのまま、うみ＝回して出す、ふしぎ＝回して、半分は裏返して出す
      let init = p.sol;
      if(forceFlip.has(i)){
        // 回して、さらに裏返した向きで出す（回すだけでは、ぜったいに入らない）
        let x = p.sol; const turns = rnd(4);
        for(let t=0;t<turns;t++) x = rot90(x);
        init = mirror(x);
      }else if(G.rotate){
        for(let k=0;k<20;k++){
          let x = p.sol; const turns = 1+rnd(3);
          for(let t=0;t<turns;t++) x = rot90(x);
          if(G.flip && Math.random()<.5) x = mirror(x);
          init = x;
          if(keyOf(x)!==keyOf(p.sol)) break;   // 向きが変わるまでやり直す（回しても同じ形のピースはそのまま）
        }
      }
      p.init = init; p.cur = init;
    });
    return { board, pieces };
  }
  return null;
}

let B = null; // いまの戦いのようす
function startBattle(g, i, opt={}){
  const jump = !!opt.jump;
  const G = GALAXIES[g], isBoss = i===8, sid = jump ? `${g}-T` : sidOf(g,i), cid = G.creatures[i];
  sfx(isBoss ? 'boss' : 'start');

  const foe = $('#foe'); foe.classList.remove('healed');
  foe.onload = () => {
    const s = Math.max(2, Math.floor(Math.min(4, 210/foe.naturalWidth, 260/foe.naturalHeight)));
    const w = foe.naturalWidth*s, h = foe.naturalHeight*s;
    foe.style.width = w+'px'; foe.style.left = (845 - w/2)+'px'; foe.style.top = (isBoss ? 340 : 392) - h + 'px';
  };
  foe.src = `img/${cid}.png`;
  // ボタン：回せない銀河では「まわす」を、裏返せない銀河では「うらがえす」を出さない
  $('#btnRot').hidden = !G.rotate; $('#btnFlip').hidden = !G.flip; $('#btnHint').hidden = false;
  $('#field').innerHTML = '';
  // 盤の大きさ：マスの大きさを、盤が板に収まるように決める
  const [rows, cols] = sizeOf(P.board);
  const C = Math.min(52, Math.floor(440/cols), Math.floor(190/rows));
  stage.style.setProperty('--C', C+'px');
  const left = Math.round(480 - cols*C/2);
  B = { g, i, sid, cid, isBoss, jump, G, P, C, left, t0:performance.now(), occ:{}, placed:{}, sel:null, hintLv:{}, hintKind:null, hintFor:null,
        rot:0, flip:0, replace:0, hint:{h4:0,h1:0,h2:0}, firstHint:null, over:false };
  B.cellEls = {};
  P.board.forEach(([r,c]) => {
    const d = document.createElement('div'); d.className = 'cell empty';
    d.style.left = (left + c*C)+'px'; d.style.top = (BOARD_TOP + r*C)+'px';
    $('#field').appendChild(d); B.cellEls[r+','+c] = d;
  });
  layoutTray(BOARD_TOP + rows*C + 16);
  B.els = {};
  P.pieces.forEach(p => { const el = document.createElement('div'); el.className = `piece home small c-${p.color}`; $('#field').appendChild(el); B.els[p.id] = el; drawPiece(p); goHome(el,p); bindDrag(el,p); });
  select(P.pieces[0].id);
}
// 手持ちの場所を決める：どの向きに回しても入る、正方形の「わく」を順にならべる
function layoutTray(top){
  const X0 = 244, X1 = 716, Y1 = 432, gap = 12;
  // 手持ちのマス1つは、なるべく36点の大きさにする（盤のマスが小さいときは、手持ちも小さくしすぎない）
  for(let ts=Math.min(1, 36/B.C); ts>=.35; ts-=.05){
    const slots = []; let x = X0, y = top, rowH = 0;
    for(const p of B.P.pieces){
      const side = Math.max(...sizeOf(p.sol)) * B.C * ts;
      if(x + side > X1){ x = X0; y += rowH + gap; rowH = 0; }
      slots.push({ x, y, side }); x += side + gap; rowH = Math.max(rowH, side);
    }
    if(y + rowH <= Y1 || ts <= .36){
      // 行ごとにまん中へ寄せる
      [...new Set(slots.map(s=>s.y))].forEach(ry => {
        const rs = slots.filter(s=>s.y===ry); const last = rs[rs.length-1];
        const sh = (X1 - X0 - (last.x + last.side - X0))/2; rs.forEach(s => s.x += sh);
      });
      B.ts = ts; stage.style.setProperty('--ts', ts);
      B.P.pieces.forEach((p,k) => p.slot = slots[k]);
      return;
    }
  }
}
function drawPiece(p){
  const el = B.els[p.id]; el.innerHTML = '';
  const [h,w] = sizeOf(p.cur);
  el.style.width = (w*B.C)+'px'; el.style.height = (h*B.C)+'px';
  p.cur.forEach(([r,c]) => { const k = document.createElement('div'); k.className='blk'; k.style.left=(c*B.C)+'px'; k.style.top=(r*B.C)+'px'; el.appendChild(k); });
}
function homeXY(p){
  const [h,w] = sizeOf(p.cur), s = p.slot;
  return [s.x + (s.side - w*B.C*B.ts)/2, s.y + (s.side - h*B.C*B.ts)/2];
}
function goHome(el,p){ el.classList.add('home','small'); const [x,y] = homeXY(p); el.style.left=x+'px'; el.style.top=y+'px'; }

// ピースを指で動かす（タップは：手持ち＝回す、盤の上＝手持ちにもどす）
function bindDrag(el, p){
  let start=null, off=null, moved=false;
  el.addEventListener('pointerdown', e => {
    if(B.over) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const s = toStage(e);
    const sc = B.placed[p.id] ? 1 : B.ts;   // 手持ちは小さいので、大きくなっても指の下がずれないように合わせる
    start = s; off = { x:(s.x - parseFloat(el.style.left))/sc, y:(s.y - parseFloat(el.style.top))/sc }; moved=false;
    select(p.id);
  });
  el.addEventListener('pointermove', e => {
    if(!start) return;
    const s = toStage(e);
    if(!moved && Math.hypot(s.x-start.x, s.y-start.y) > 8){
      moved = true; el.classList.remove('home','small'); el.classList.add('drag');
      if(B.placed[p.id]){ unplace(p); B.replace++; }   // 盤から持ち上げた＝置き直し
    }
    if(moved){ el.style.left = (s.x-off.x)+'px'; el.style.top = (s.y-off.y)+'px'; skillDrag(s.x, s.y); }
  });
  const end = () => {
    if(!start) return;
    start = null; el.classList.remove('drag');
    if(!moved){
      if(B.placed[p.id]){ unplace(p); B.replace++; goHome(el,p); }
      else if(B.G.rotate) rotatePiece(p);
      return;
    }
    const c = Math.round((parseFloat(el.style.left) - B.left)/B.C);
    const r = Math.round((parseFloat(el.style.top) - BOARD_TOP)/B.C);
    if(fits(p, r, c)){ sfx('place'); place(p, r, c); el.style.left=(B.left+c*B.C)+'px'; el.style.top=(BOARD_TOP+r*B.C)+'px'; skillPlace(p, r, c); checkClear(); }
    else goHome(el, p);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function fits(p, r, c){ return p.cur.every(([dr,dc]) => { const k = (r+dr)+','+(c+dc); return B.cellEls[k] && !B.occ[k]; }); }
function place(p, r, c){ B.placed[p.id] = [r,c]; p.cur.forEach(([dr,dc]) => B.occ[(r+dr)+','+(c+dc)] = p.id); clearCellHint(); if(B.hintFor===p.id) closeHint(); }
function unplace(p){ const at = B.placed[p.id]; if(!at) return; p.cur.forEach(([dr,dc]) => delete B.occ[(at[0]+dr)+','+(at[1]+dc)]); delete B.placed[p.id]; }
function select(id){ B.sel = id; Object.entries(B.els).forEach(([k,el]) => el.classList.toggle('sel', k===id)); }
function selPiece(){ return B.P.pieces.find(q => q.id===B.sel && !B.placed[q.id]); }

// 回す・裏返す（手持ちのピースだけ）
function rotatePiece(p){ sfx('rot'); p.cur = rot90(p.cur); B.rot++; drawPiece(p); goHome(B.els[p.id], p); refreshHint(); }
function flipPiece(p){ sfx('rot'); p.cur = mirror(p.cur); B.flip++; drawPiece(p); goHome(B.els[p.id], p); refreshHint(); }
$('#btnRot').addEventListener('click', () => { if(!B||B.over) return; const p = selPiece(); if(p) rotatePiece(p); else toast('てもちの ピースを えらんでね'); });
$('#btnFlip').addEventListener('click', () => { if(!B||B.over) return; const p = selPiece(); if(p) flipPiece(p); else toast('てもちの ピースを えらんでね'); });

/* ===== 9. 手助け（4 → 1 → 2 の順に、少しずつ強く） ================= */
//  h4＝まわすと どうなる？（4つの向き）  h1＝置き場所を光らせる  h2＝向きの影
function hintOrder(){ return B.G.rotate ? ['h4','h1','h2'] : ['h1']; }
$('#btnHint').addEventListener('click', () => {
  if(!B || B.over) return;
  const p = selPiece() || B.P.pieces.find(q => !B.placed[q.id]);
  if(!p) return;
  select(p.id);
  const order = hintOrder();
  const lv = Math.min(B.hintLv[p.id] || 0, order.length-1);
  const kind = order[lv];
  B.hintLv[p.id] = lv+1;
  B.hint[kind]++;
  if(B.firstHint===null) B.firstHint = Math.round((performance.now()-B.t0)/1000);
  showHint(kind, p);
});
function miniShape(cells, cell, color, ghost){
  const [h,w] = sizeOf(cells);
  const d = document.createElement('div'); d.className = `mini c-${color}` + (ghost?' ghost':''); d.style.width=(w*cell)+'px'; d.style.height=(h*cell)+'px';
  cells.forEach(([r,c]) => { const k = document.createElement('div'); k.className='blk'; k.style.cssText=`left:${c*cell}px;top:${r*cell}px;width:${cell}px;height:${cell}px;border-width:2px;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--sh)`; d.appendChild(k); });
  return d;
}
function showHint(kind, p){
  closeHint(); clearCellHint();
  B.hintKind = kind; B.hintFor = p.id;
  if(kind==='h1'){
    p.sol.forEach(([dr,dc]) => { const el = B.cellEls[(p.at[0]+dr)+','+(p.at[1]+dc)]; if(el) el.classList.add('hint'); });
    toast('ひかっている ところに はまるよ');
    return;
  }
  if(kind==='h2'){
    // 正しい向きの影を、盤の上の正しい場所に重ねる
    p.sol.forEach(([dr,dc]) => {
      const g = document.createElement('div'); g.className = `ghost-on c-${p.color}`;
      g.style.left = (B.left + (p.at[1]+dc)*B.C)+'px'; g.style.top = (BOARD_TOP + (p.at[0]+dr)*B.C)+'px';
      g.style.width = g.style.height = B.C+'px';
      $('#field').appendChild(g);
    });
    toast('かげと おなじ むきに して、かさねてね');
    return;
  }
  // h4：4つの向きを並べ、はまる向きに★をつける
  const box = document.createElement('div'); box.id='hintBox';
  box.innerHTML = '<h3>まわすと、どうなる？</h3><div class="grid"></div><p class="msg"></p>';
  let x = p.cur, firstOk = -1;
  ['いまの むき','1かい まわす','2かい まわす','3かい まわす'].forEach((lbl, k) => {
    const ok = keyOf(x) === keyOf(p.sol);
    if(ok && firstOk<0) firstOk = k;
    const o = document.createElement('div'); o.className = 'opt' + (ok?' ok':'');
    const [h,w] = sizeOf(x); const cell = Math.floor(Math.min(14, 60/Math.max(h,w)));
    o.appendChild(miniShape(x, cell, p.color));
    const s = document.createElement('span'); s.textContent = ok ? '★ この むき！' : lbl; o.appendChild(s);
    box.querySelector('.grid').appendChild(o); x = rot90(x);
  });
  box.querySelector('.msg').textContent = firstOk===0 ? 'いまの むきで はまるよ' : firstOk>0 ? `あと ${firstOk}かい まわすと はまるよ` : 'まず うらがえして みよう';

function checkClear(){
  if(Object.keys(B.occ).length !== B.P.board.length) return;
  B.over = true; clearCellHint(); closeHint(); select(null);
  const sec = Math.round((performance.now()-B.t0)/1000);
  const n = B.P.pieces.length;
  const stars = starsFor(sec, B.g, n);
  // 最短で何回まわせばよかったか（はじめの向きから、置いた向きまで）
  B.rotMin = B.G.rotate ? B.P.pieces.reduce((s,p) => s + minRot(p.init, p.cur, B.G.flip), 0) : 0;
  record('clear', sec, stars);
  sfx('clear');
  if(B.jump){ jumpPassed(); return; }
  const old = save.progress[B.sid];
  save.progress[B.sid] = { stars: Math.max(stars, old?old.stars:0), bestSec: Math.min(sec, old?old.bestSec:sec) };
  const first = !save.allies.includes(B.cid);
  if(first) save.allies.push(B.cid);
  // 図鑑：初めてなおした星座の形を、その子だけの形として残す
  save.zukan = save.zukan || {};
  if(!save.zukan[B.cid]) save.zukan[B.cid] = { date: today(), shape: B.P.board, times: 0 };
  save.zukan[B.cid].times++;
  store();
  $('#foe').classList.add('healed'); sparkle(); skillClear();
  $('#btnHint').hidden = true; $('#btnRot').hidden = true; $('#btnFlip').hidden = true;
  // つぎのステージ（ボスのあとは、つぎの銀河の1）
  let next = null;
  if(B.i < 8 && stageOpen(B.g, B.i+1)) next = [B.g, B.i+1];

  const card = document.createElement('div'); card.id = 'result';

let actx = null;
function initAudio(){ try{ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){ actx = null; } }
const soundOn = () => save.settings.sound !== false;

function tone(freq, t0, len, type='square', vol=.08){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
  const t = actx.currentTime + t0; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+len);
  o.start(t); o.stop(t+len+.02);
}
function sfx(kind){
  if(!soundOn() || !actx) return;
  try{
    if(kind==='place') tone(880, 0, .08);
    if(kind==='rot')   tone(520, 0, .05, 'triangle', .1);
    if(kind==='start') { tone(523,0,.08); tone(784,.09,.1); }
    if(kind==='clear') [523,659,784,1047].forEach((f,k) => tone(f, k*.1, .16));
    if(kind==='boss')  [196,247,294].forEach((f,k) => tone(f, k*.14, .3, 'sawtooth', .06));
    if(kind==='ok')    { tone(988,0,.07); tone(1319,.08,.12); }

}

/* ===== 16. コード（きろくコード・せっていコード）の作り方 ============ */
// 文字 ⇔ URLにも使える英数字（base64url）
function b64u(bytes){ let s=''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(str){ const s = atob(str.replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function packText(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){ // 使える端末では、ちぢめて短くする
    const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
    return 'z' + b64u(new Uint8Array(buf));
  }
  return 'p' + b64u(raw);
}
async function unpackText(body){
  const bytes = unb64u(body.slice(1));
  if(body[0]==='z'){
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
// いま どこまで すすんだか（いちばん先の なおした ステージ）
function whereNow(sv){
  for(let g=NGAL; g>=1; g--) for(let i=8; i>=0; i--) if(sv.progress[sidOf(g,i)]) return sidOf(g,i);
  return '－';
}
function summaryOf(sv){
  const logs = sv.logs || [];
  const rotClears = logs.filter(l => l.result==='clear' && l.galaxy>=2).slice(-10);
  const last20 = logs.slice(-20);
  return {
    id: sv.player ? sv.player.id : '?', nick: sv.player ? sv.player.nick : '?',
    at: whereNow(sv), stars: Object.values(sv.progress).reduce((a,p) => a + p.stars, 0),
    w10: rotClears.length ? +(rotClears.reduce((a,l) => a + (l.rotWaste||0), 0)/rotClears.length).toFixed(1) : null,
    hr: last20.length ? Math.round(100 * last20.filter(l => (l.hint.h1+l.hint.h2+l.hint.h4) > 0).length / last20.length) : null,
    last: logs.length ? logs[logs.length-1].t.slice(0,10) : null,

const LOG_KEYS = ['t','stage','result','stars','sec','rot','rotMin','rotWaste','flip','replace','h4','h1','h2','firstHintSec'];
function logToArr(l){ return [Math.round(new Date(l.t).getTime()/1000), l.stage, l.result==='clear'?1:0, l.stars, l.sec, l.rot, l.rotMin, l.rotWaste, l.flip, l.replace, l.hint.h4, l.hint.h1, l.hint.h2, l.firstHintSec]; }
function arrToLog(a){ const o = {}; LOG_KEYS.forEach((k,i) => o[k] = a[i]); o.t = new Date(a[0]*1000).toISOString(); o.result = a[2] ? 'clear' : 'quit'; o.galaxy = +String(a[1])[0]; o.hint = { h4:o.h4, h1:o.h1, h2:o.h2 }; return o; }
async function makeRecordCode(){

}

async function applySettings(text){

// カメラでQRを読む（使えない端末では、はりつけに切りかえる）
async function startScan(area, onText, onMsg){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.jsQR){ onMsg('この たんまつでは カメラが つかえないよ。はりつけてね'); return null; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false }); }
  catch(e){ onMsg('カメラが つかえないよ。はりつけてね'); return null; }
  const v = document.createElement('video'); v.setAttribute('playsinline',''); v.muted = true; v.srcObject = stream; area.innerHTML = ''; area.appendChild(v);
  await v.play().catch(()=>{});
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently:true });
  let alive = true, lastText = '';
  const loop = () => {
    if(!alive) return;
    if(v.videoWidth){
      cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0);
      const img = cx.getImageData(0, 0, cv.width, cv.height);
      const r = jsQR(img.data, img.width, img.height);
      if(r && r.data && r.data !== lastText){ lastText = r.data; onText(r.data); }
    }
    requestAnimationFrame(loop);
  };
  loop();
  return () => { alive = false; stream.getTracks().forEach(t => t.stop()); area.innerHTML = ''; };
}

const T_KEY = 'seizapuzzle_teacher_v1';   // 先生の端末に、集めた記録を残す場所（子どもの記録とは別）
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function tIngest(text){
  let n = 0, bad = 0;
  for(const m of String(text).matchAll(/SZR1([zp][A-Za-z0-9_-]+)/g)){
    try{ const o = await unpackText(m[1]); const logs = (o.L||[]).map(arrToLog);
      const sv = { player:{id:o.id, nick:o.nick}, progress:Object.fromEntries(Object.entries(o.pr||{}).map(([k,v]) => [k,{stars:v[0],bestSec:v[1]}])), allies:o.al||[], logs };
      const cur = T.students[o.id] || {};
      if(!cur.made || cur.made <= o.made){ T.students[o.id] = { nick:o.nick, made:o.made, st:o.st, jp:o.jp, sum:summaryOf(sv), logs, prog:sv.progress, full:true }; }
      n++;
    }catch(e){ bad++; }
  }
  for(const m of String(text).matchAll(/SZQ1([zp][A-Za-z0-9_-]+)/g)){
    try{ const o = await unpackText(m[1]); const cur = T.students[o.id] || {};
      // QRは要約だけ。くわしい記録（logs）があれば、それは残したまま要約だけ新しくする
      if(!cur.made || cur.made <= o.made){ T.students[o.id] = { ...cur, nick:o.nick, made:o.made, sum:o, full: !!cur.logs }; }
      n++;
    }catch(e){ bad++; }
  }
  tStore(T);
  return `${n}人ぶん よみこみました` + (bad ? `（${bad}こは よめませんでした）` : '');
}

    if(!/^\d{1,4}$/.test(id) || !nick){ $('#hMsg').textContent = '番号（数字）とニックネームを入れてください'; return; }
    save.player = { id, nick }; save.settings.startGalaxy = +$('#hSt').value; store();
    $('#hMsg').textContent = '保存しました';
  });
}

show('title');
</script>
